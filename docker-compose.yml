services:
  postgres:
    image: postgres:16-alpine
    container_name: aiclip-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiclip
      POSTGRES_USER: aiclip
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiclip -d aiclip"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aiclip-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: aiclip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set aiclip http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing aiclip/aiclip-media &&
        mc anonymous set private aiclip/aiclip-media &&
        echo 'MinIO bucket initialized successfully'
      "

volumes:
  pgdata:
  miniodata:
