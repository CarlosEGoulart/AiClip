services:
  postgres:
    image: postgres:16-alpine
    container_name: aiclip-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiclip
      POSTGRES_USER: aiclip
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiclip -d aiclip"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
