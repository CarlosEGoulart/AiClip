# E2E Caption Flow Integration Test
# Runs the real end-to-end caption flow test with MinIO, FFmpeg, and Python worker

name: E2E Caption Flow Test

on:
  push:
    branches:
      - '@carlosegoulart/101/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  e2e-caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || startsWith(github.head_ref, '@carlosegoulart/101/')

    services:
      postgres:
        image: postgres:16.4-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: aiclip
          POSTGRES_USER: aiclip
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U aiclip -d aiclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: pdo_pgsql, redis, pcntl
          coverage: none

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -filters | grep subtitles

      - name: Install moto S3 server
        run: |
          pip install moto[server] awscli

      - name: Start moto S3 server
        run: |
          moto_server s3 -H 0.0.0.0 -p 9000 > /tmp/moto.log 2>&1 &
          echo $! > /tmp/moto.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ >/dev/null 2>&1; then
              echo "moto S3 is healthy"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/moto.log
          exit 1

      - name: Create S3 bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_ADDRESSING_STYLE: path
        run: |
          aws --endpoint-url=http://127.0.0.1:9000 s3 mb s3://aiclip-media

      - name: Install Python worker
        run: |
          cd services/worker
          pip install -e .[dev,scene_detection]

      - name: Install PHP dependencies
        working-directory: ./apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Generate test video fixture
        run: |
          cd apps/api
          php -r "
          require 'vendor/autoload.php';
          use SymfonyComponentProcessProcess;
          $cmd = ['ffmpeg', '-y', '-f', 'lavfi', '-i', 'testsrc=duration=30:size=1920x1080:rate=30', '-f', 'lavfi', '-i', 'sine=frequency=440:duration=30', '-c:v', 'libx264', '-preset', 'fast', '-crf', '23', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-shortest', 'tests/fixtures/caption_test_video.mp4'];
          $p = new Process($cmd, null, null, null, 120);
          $p->run();
          if (!$p->isSuccessful()) { echo 'FAILED: ' . $p->getErrorOutput(); exit(1); }
          echo 'Generated: ' . filesize('tests/fixtures/caption_test_video.mp4') . ' bytes';
          "

      - name: Run database migrations
        working-directory: ./apps/api
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret

      - name: Run E2E Caption Flow Tests
        working-directory: ./apps/api
        run: php artisan test --filter=RenderMediaClipCaptionE2ETest --compact
        env:
          APP_ENV: testing
          MEDIA_CLIP_RANKING_PROVIDER: fake
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
          QUEUE_CONNECTION: sync

      - name: Run Pint (Code Style)
        working-directory: ./apps/api
        run: vendor/bin/pint --dirty --format agent

      - name: Run PHPStan (Static Analysis)
        working-directory: ./apps/api
        run: phpstan analyse --level=5
