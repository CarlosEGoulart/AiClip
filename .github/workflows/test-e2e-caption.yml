# E2E Caption Flow Integration Test
# Runs the real end-to-end caption flow test with MinIO, FFmpeg, and Python worker

name: E2E Caption Flow Test

on:
  push:
    branches:
      - '@carlosegoulart/101/**'
  pull_request:
    branches:
      - '@carlosegoulart/101/**'

jobs:
  e2e-caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: aiclip
          POSTGRES_USER: aiclip
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U aiclip -d aiclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
        ports: ['9000:9000', '9001:9001']
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, pcntl
          coverage: none

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -filters | grep subtitles

      - name: Start MinIO bucket
        run: |
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb local/aiclip-media --ignore-existing

      - name: Install Python worker
        run: |
          cd services/worker
          pip install -e .[dev,transcription,scene_detection]

      - name: Generate test video fixture
        run: |
          cd apps/api
          php -r "
          require 'vendor/autoload.php';
          use Symfony\Component\Process\Process;
          \$cmd = ['ffmpeg', '-y', '-f', 'lavfi', '-i', 'testsrc=duration=30:size=1920x1080:rate=30', '-f', 'lavfi', '-i', 'sine=frequency=440:duration=30', '-c:v', 'libx264', '-preset', 'fast', '-crf', '23', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-shortest', 'tests/fixtures/caption_test_video.mp4'];
          \$p = new Process(\$cmd, null, null, null, 120);
          \$p->run();
          if (!\$p->isSuccessful()) { echo 'FAILED: ' . \$p->getErrorOutput(); exit(1); }
          echo 'Generated: ' . filesize('tests/fixtures/caption_test_video.mp4') . ' bytes';
          "

      - name: Install PHP dependencies
        working-directory: ./apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Run database migrations
        working-directory: ./apps/api
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret

      - name: Run E2E Caption Flow Tests
        working-directory: ./apps/api
        run: php artisan test --filter=RenderMediaClipCaptionE2ETest --compact
        env:
          APP_ENV: testing
          MEDIA_CLIP_RANKING_PROVIDER: fake
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
          QUEUE_CONNECTION: sync

      - name: Run Pint (Code Style)
        working-directory: ./apps/api
        run: vendor/bin/pint --dirty --format agent

      - name: Run PHPStan (Static Analysis)
        working-directory: ./apps/api
        run: phpstan analyse --level=5