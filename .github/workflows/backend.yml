name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiclip_test
          POSTGRES_USER: aiclip
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiclip -d aiclip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data --console-address :9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Initialize MinIO bucket
        run: |
          # Run mc commands via MinIO Docker image (avoids downloading binary)
          docker run --rm --network host \
            quay.io/minio/mc:latest \
            sh -c "
              mc alias set aiclip http://127.0.0.1:9000 minioadmin minioadmin &&
              mc mb --ignore-existing aiclip/aiclip-media &&
              mc anonymous set private aiclip/aiclip-media &&
              echo 'MinIO bucket initialized successfully'
            "

      - name: Verify MinIO health
        run: |
          curl -f http://127.0.0.1:9000/minio/health/live || exit 1
          echo "MinIO is healthy"

      - name: Prepare Environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip_test
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          MEDIA_DISK: media
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
        run: php artisan migrate --force

      - name: Run Tests
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip_test
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          MEDIA_DISK: media
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
        run: php artisan test
