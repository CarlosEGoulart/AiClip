name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: aiclip
          POSTGRES_USER: aiclip
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiclip -d aiclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Install moto S3 server
        run: |
          pip install moto[server] awscli

      - name: Start moto S3 server
        run: |
          moto_server s3 -H 0.0.0.0 -p 9000 > /tmp/moto.log 2>&1 &
          echo $! > /tmp/moto.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ >/dev/null 2>&1; then
              echo "moto S3 is healthy"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/moto.log
          exit 1

      - name: Install worker dependencies
        working-directory: services/worker
        run: |
          pip install -r requirements.txt
          pip install -e ".[scene_detection,dev]"

      - name: Run worker tests
        working-directory: services/worker
        run: python -m pytest tests/ -v

      - name: Create S3 bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_ADDRESSING_STYLE: path
        run: |
          aws --endpoint-url=http://127.0.0.1:9000 s3 mb s3://aiclip-media

      - name: Prepare Environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          MEDIA_DISK: media
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
        run: php artisan migrate --force

      - name: Run Tests
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          MEDIA_DISK: media
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_BUCKET: aiclip-media
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT: true
        run: php artisan test
