name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: aiclip
          POSTGRES_USER: aiclip
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiclip -d aiclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Install worker dependencies
        working-directory: services/worker
        run: |
          pip install -r requirements.txt
          pip install -e ".[scene_detection,dev]"

      - name: Run worker tests
        working-directory: services/worker
        run: python -m pytest tests/ -v

      - name: Prepare Environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          FILESYSTEM_MEDIA_DRIVER: local
        run: php artisan migrate --force

      - name: Run Tests
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiclip
          DB_USERNAME: aiclip
          DB_PASSWORD: secret
          FILESYSTEM_MEDIA_DRIVER: local
        run: php artisan test
