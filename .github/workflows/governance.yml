name: governance
"on":
  pull_request: {}
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/governance/requirements.txt
      - run: python -m unittest discover -s tests/governance -p 'test_*.py' -v
